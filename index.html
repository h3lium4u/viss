<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP Fiori - Assigned vs Not Assigned Analytics</title>
    <link rel="icon" type="image/png" href="https://ui5.sap.com/resources/sap/ui/documentation/sdk/images/favicon.ico">
    <link rel="stylesheet" type="text/css" href="webapp/css/style.css">
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.f"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-resourceroots='{
            "sap.dashboard": "./webapp"
        }'
        data-sap-ui-oninit="module:sap/dashboard/init"
        onerror="handleBootstrapError()">
    </script>
    <script>
        function handleBootstrapError() {
            var loader = document.getElementById("ui5-loading-indicator");
            if (loader) {
                loader.innerHTML = '<div style="color: #bb0000; font-size: 1.2rem; font-weight: bold; margin-bottom: 8px;">Network Error: Failed to load SAPUI5 CDN</div>' +
                    '<div style="color: #556b82; max-width: 500px; text-align: center;">Please ensure you have an active internet connection to download the SAPUI5 framework from ui5.sap.com.</div>';
            }
        }
    </script>
</head>
<body class="sapUiBody" id="content" style="height: 100%; margin: 0; padding: 0;">
    <div id="ui5-loading-indicator" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1c2d42; background: #f5f6f7;">
        <div style="width: 48px; height: 48px; border: 4px solid #d5dadd; border-top-color: #0a6ed1; border-radius: 50%; animation: sapSpin 0.8s linear infinite;"></div>
        <h2 style="margin: 18px 0 6px 0; font-size: 1.2rem; font-weight: 600;">Loading SAP Fiori Analytics...</h2>
        <p style="margin: 0; color: #556b82; font-size: 0.88rem;">Initializing SAPUI5 Horizon components and deterministic cohorts</p>
        <style>@keyframes sapSpin { to { transform: rotate(360deg); } }</style>
    </div>
</body>
</html>
